[project]
name = "demandsync-motor"
version = "0.1.0"
description = "Motor de predicción de demanda de DemandSync — librería Python invocada por el job batch (sin HTTP)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=16,<19",
    "statsforecast>=1.7,<2",
    "mlforecast>=0.13,<1",
    # Tope en 4.7 a propósito (M2.3, 2026-08-05). Con `lightgbm==4.7.0` en Windows,
    # `LGBMRegressor.fit` muere con `OSError: access violation` si `pyarrow` se importó
    # antes — o sea SIEMPRE acá, porque la capa de datos lee parquet. Es conflicto de
    # runtimes en la carga de DLLs, no un problema de los datos: falla igual con arrays
    # contiguos, sin columnas `category` y con `n_jobs=1`, y `KMP_DUPLICATE_LIB_OK` no lo
    # arregla. 4.6.0 no lo tiene (verificado 3/3 en ambos sentidos).
    # Antes de subir el tope, corré `tests/test_entorno_lightgbm.py`: falla con 4.7.0.
    "lightgbm>=4.3,<4.7",
    "hierarchicalforecast>=0.4,<1",
    "utilsforecast>=0.1.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
# Solo para `motor/scripts/extraer_snap.py` (M1.8). NO es dependencia del paquete: el
# motor lee hechos por interfaz de repositorio y es agnóstico a la fuente (ADR-009).
# Instalar con `pip install -e ".[extract]"` únicamente en la máquina autorizada.
extract = [
    "sqlalchemy>=2,<3",
    "pymysql>=1.1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# El IPC del INDEC (último peldaño del fallback de ADR-002) es dato público que viaja
# dentro del paquete: sin esto la rueda se construye sin él y la cascada se queda sin fondo.
[tool.setuptools.package-data]
"motor.datos" = ["*.csv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Redes de seguridad que no se desactivan ni se marcan como skip. Correlas solas
    # con `pytest -m innegociable` antes de tocar deflación, features o el arnés.
    "innegociable: red contra un error que se manifiesta como una buena noticia (M1.3)",
]
